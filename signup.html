<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회원가입 - 학술제 포트폴리오</title>
    <!-- 1. Pretendard 폰트 로드 -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"
    />
    <!-- 2. 공통 스타일 (왼쪽 패널, 배경 애니메이션 등) -->
    <link rel="stylesheet" href="css/common.css" />
    <!-- 3. 회원가입 페이지 전용 스타일 -->
    <link rel="stylesheet" href="css/signup.css" />
  </head>
  <body>
    <div class="container">
      <!-- [왼쪽] 프로젝트 안내 영역 (일렁이는 애니메이션 적용) -->
      <div class="left-panel">
        <div class="wave-bg"></div>
        <div class="content">
          <div class="icon-box">
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="9" y1="9" x2="15" y2="15"></line>
              <line x1="15" y1="9" x2="9" y2="15"></line>
            </svg>
          </div>
          <h1>당신의 프로젝트 경험을<br />자산으로</h1>
          <p>
            흩어진 프로젝트 산출물을 하나로 모아 AI가 포트폴리오를<br />설계합니다.
          </p>

          <div class="feature-list">
            <div class="feature-item">
              <div class="feature-icon">&lt;&gt;</div>
              <div class="feature-text">
                <strong>코드 & 문서 기반 Q&A</strong>
                <span
                  >저장소와 연동하여 코드를 분석하고 기술적 의사결정 과정에 대한
                  답변을 자동 생성합니다.</span
                >
              </div>
            </div>

            <div class="feature-item">
              <div class="feature-icon">📈</div>
              <div class="feature-text">
                <strong>자동 타임라인 생성</strong>
                <span
                  >프로젝트 기여도와 커밋 기록을 바탕으로 업무 히스토리와 성과를
                  시각화합니다.</span
                >
              </div>
            </div>

            <div class="feature-item">
              <div class="feature-icon">👤</div>
              <div class="feature-text">
                <strong>면접 예상 질문 생성</strong>
                <span
                  >AI가 내 프로젝트 아키텍처를 분석하여 실전 같은 맞춤형 면접
                  질문을 제안합니다.</span
                >
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- [오른쪽] 회원가입 양식 영역 (소셜 로그인 제거됨) -->
      <div class="right-panel">
        <div class="login-wrapper">
          <h2>회원가입</h2>
          <div class="subtitle">학술제에 오신 것을 환영합니다</div>

          <form action="#" method="POST">
            <!-- 1. 이메일 입력 및 인증번호 발송 -->
            <div class="input-group">
              <label for="email">이메일</label>
              <div class="input-row">
                <input
                  type="email"
                  id="email"
                  placeholder="name@company.com"
                  required
                />
                <button type="button" class="btn-action">인증 발송</button>
              </div>
            </div>

            <!-- 2. 인증번호 확인 -->
            <div class="input-group">
              <label for="auth-code">인증번호</label>
              <div class="input-row">
                <input
                  type="text"
                  id="auth-code"
                  placeholder="인증번호 6자리 입력"
                  required
                />
                <button type="button" class="btn-action">확인</button>
              </div>
            </div>

            <!-- 3. 비밀번호 -->
            <div class="input-group">
              <label for="password">비밀번호</label>
              <input
                type="password"
                id="password"
                placeholder="8자 이상 영문, 숫자, 특수문자"
                required
              />
            </div>

            <!-- 4. 비밀번호 확인 -->
            <div class="input-group">
              <label for="password-confirm">비밀번호 확인</label>
              <input
                type="password"
                id="password-confirm"
                placeholder="비밀번호를 한번 더 입력해주세요"
                required
              />
            </div>

            <button type="submit" class="btn-login">회원가입</button>
          </form>

          <!-- 기존 로그인 페이지(index.html)로 돌아가는 링크 -->
          <div class="signup-link">
            이미 계정이 있으신가요? <a href="index.html">로그인</a>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
