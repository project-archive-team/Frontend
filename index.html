<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로그인 페이지</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <!-- 왼쪽 영역 -->
      <div class="left-panel">
        <div class="wave-bg"></div>
        <div class="content">
          <div class="icon-box">
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="9" y1="9" x2="15" y2="15"></line>
              <line x1="15" y1="9" x2="9" y2="15"></line>
            </svg>
          </div>
          <h1>당신의 프로젝트 경험을<br />자산으로</h1>
          <p>
            흩어진 프로젝트 산출물을 하나로 모아 AI가 포트폴리오를<br />설계합니다.
          </p>

          <div class="feature-list">
            <div class="feature-item">
              <div class="feature-icon">&lt;&gt;</div>
              <div class="feature-text">
                <strong>코드 & 문서 기반 Q&A</strong>
                <span
                  >저장소와 연동하여 코드를 분석하고 기술적 의사결정 과정에 대한
                  답변을 자동 생성합니다.</span
                >
              </div>
            </div>
            <div class="feature-item">
              <div class="feature-icon">📈</div>
              <div class="feature-text">
                <strong>자동 타임라인 생성</strong>
                <span
                  >프로젝트 기여도와 커밋 기록을 바탕으로 업무 히스토리와 성과를
                  시각화합니다.</span
                >
              </div>
            </div>
            <div class="feature-item">
              <div class="feature-icon">👤</div>
              <div class="feature-text">
                <strong>면접 예상 질문 생성</strong>
                <span
                  >AI가 내 프로젝트 아키텍처를 분석하여 실전 같은 맞춤형 면접
                  질문을 제안합니다.</span
                >
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 오른쪽 영역 -->
      <div class="right-panel">
        <div class="login-wrapper">
          <h2>로그인</h2>
          <p class="subtitle">학술제에 오신 것을 환영합니다</p>

          <form id="loginForm">
            <div class="input-group">
              <label for="email">이메일</label>
              <input
                type="email"
                id="email"
                placeholder="name@company.com"
                required
              />
            </div>
            <div class="input-group">
              <label for="password">비밀번호</label>
              <input
                type="password"
                id="password"
                placeholder="••••••••"
                required
              />
            </div>
            <button type="submit" class="btn-login">로그인</button>
          </form>

          <div class="divider">
            <span>또는 간편하게 로그인</span>
          </div>

          <div class="social-login">
            <button class="btn-social btn-google" id="googleLogin">
              <img src="https://www.google.com/favicon.ico" alt="Google" />
              Google로 계속하기
            </button>
            <button class="btn-social btn-github" id="githubLogin">
              <svg
                viewBox="0 0 24 24"
                width="20"
                height="20"
                stroke="currentColor"
                stroke-width="2"
                fill="none"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"
                ></path>
              </svg>
              GitHub로 계속하기
            </button>
          </div>

          <p class="signup-link">
            계정이 없으신가요? <a href="#" id="signupLink">회원가입</a>
          </p>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
